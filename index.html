<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="https://play-lh.googleusercontent.com/f6kVXGwfe6vK9hJ-okf0In_wsw_pUU-Wp2h1vs-GrfuF98rsL1RZwkMiOW1_sp-R5P4r7AowRa62fbN043xZELk=w240-h480-rw">
    <link rel="icon" type="image/png" sizes="32x32" href="https://play-lh.googleusercontent.com/f6kVXGwfe6vK9hJ-okf0In_wsw_pUU-Wp2h1vs-GrfuF98rsL1RZwkMiOW1_sp-R5P4r7AowRa62fbN043xZELk=w240-h480-rw">
    <link rel="icon" type="image/png" sizes="16x16" href="https://play-lh.googleusercontent.com/f6kVXGwfe6vK9hJ-okf0In_wsw_pUU-Wp2h1vs-GrfuF98rsL1RZwkMiOW1_sp-R5P4r7AowRa62fbN043xZELk=w240-h480-rw">
    <title>Gacha Club - Play Online</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #flash-container {
            width: 100vw;
            height: 100vh;
        }

        ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- 1. Load the official Ruffle player script from a public CDN -->
    <script src="https://unpkg.com/ruffle-player@latest/dist/ruffle-player.js"></script>
</head>

<body>
    <div id="flash-container"></div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            unmuteOverlay: "hidden",
            splashScreen: false,
            allowScriptAccess: true
        };
    </script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle/ruffle.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");

            player.style.width = "100%";
            player.style.height = "100%";

            container.appendChild(player);

            player.ruffle().load({
                url: "GachaClub.swf",
                autoplay: "on",
                unmuteOverlay: "hidden",
                allowScriptAccess: true
            });
        });
    </script>
</body>
</html>
