<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Club - Play Online</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #flash-container {
            width: 100%;
            height: 100%;
            max-width: 960px;
            max-height: 540px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ruffle-player {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div id="flash-container"></div>

    <script>
        window.addEventListener("DOMContentLoaded", function () {
            if (!window.RufflePlayer) {
                console.error("Ruffle failed to load.");
                return;
            }

            const ruffle = window.RufflePlayer.newest();

            if (!ruffle) {
                console.error("Ruffle player is unavailable.");
                return;
            }

            const player = ruffle.createPlayer();
            const container = document.getElementById("flash-container");

            container.appendChild(player);

            player.config = {
                autoplay: "on",
                unmuteOverlay: "true",
                allowScriptAccess: true
            };

            player.load("GachaClub.swf");
        });
    </script>
</body>
</html>
