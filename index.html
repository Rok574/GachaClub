<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gacha Club - Play Online</title>
    <style>
        /* This centers the game on your screen and makes it look clean */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #flash-container {
            width: 100%;
            max-width: 960px; /* Adjust the width to fit the game's aspect ratio */
            height: 100%;
            max-height: 540px; /* Adjust the height to fit the game's aspect ratio */
        }
    </style>
    <!-- 1. Load the official Ruffle player script from a public CDN -->
    <script src="https://unpkg.com/ruffle-player@latest/dist/ruffle-player.js"></script>
</head>
<body>

    <!-- 2. The container where your Flash game will load -->
    <div id="flash-container"></div>

    <script>
        // 3. Wait for the webpage to completely load
        window.addEventListener("DOMContentLoaded", () => {
            // Access the Ruffle object loaded from the CDN
            const ruffle = window.RufflePlayer.newest();
            
            // Create a new player element
            const player = ruffle.createPlayer();
            
            // Find our HTML container and put the player inside it
            const container = document.getElementById("flash-container");
            container.appendChild(player);

            // 4. Configure and load your specific SWF file
            player.load({
                url: "GachaClub.swf",
                // Enables the browser to store shared objects (.sol files / save data)
                allowScriptAccess: true
            });
        });
    </script>

</body>
</html>
